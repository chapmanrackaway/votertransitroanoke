name: Refresh site data

# Builds docs/data (bus schedules, polling-place coordinates, precinct
# boundaries) and commits it to main. GitHub Pages serves docs/ straight from
# the branch, so a failed refresh leaves the last good data online.

on:
  push:
    branches: [main]
    paths-ignore: ['docs/data/**']
  pull_request:
  workflow_dispatch:
  schedule:
    # Every morning, ~6:15 AM Eastern
    - cron: '15 10 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build data
        run: node scripts/build-data.mjs
      - name: Summarize data
        run: |
          node -e '
            const t = require("./docs/data/transit.json");
            const s = require("./docs/data/site-data.json");
            console.log("Schedule date:", t.serviceDate, t.substituted ? "(substituted for " + t.targetDate + ")" : "");
            console.log("Feed covers:", JSON.stringify(t.feedRange), "fare:", JSON.stringify(t.fare));
            console.log("Routes:", t.routes.map(r => r.short || r.long).join(", "));
            console.log("Stops:", t.stops.length, "patterns:", t.patterns.length);
            for (const p of s.places) console.log(p.lat ? "  ok  " : "  ??  ", p.place, p.lat, p.lon);
            console.log("Precinct boundaries:", s.hasPrecincts);
          '
      - name: Commit updated data
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Data unchanged."
          else
            git commit -m "Refresh transit and polling-place data"
            git push
          fi
